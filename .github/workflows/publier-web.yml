# Construit la version web et la publie sur la branche `gh-pages`.
#
# Pourquoi cette branche plutôt que le mécanisme « GitHub Actions » de Pages :
# activer un site Pages demande des droits d'administration que le jeton des
# workflows n'a pas (« Resource not accessible by integration »). Pousser une
# branche, en revanche, il sait le faire. GitHub sert alors le site depuis
# `gh-pages`.
#
# L'application est disponible à l'adresse
# https://<compte>.github.io/Evobusiness/ — c'est ce lien qu'on ouvre dans
# Safari pour l'ajouter à l'écran d'accueil de l'iPhone.
name: Publier l'application web

on:
  push:
    branches: [main, claude/hair-sales-management-app-wfpe8z]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-web
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version figée : une nouvelle version de Flutter ne doit pas casser
      # la publication du jour au lendemain.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      # --no-web-resources-cdn : tout est servi depuis l'application, sinon
      # elle ne fonctionnerait plus sans connexion.
      # --base-href : nom du dépôt, obligatoire pour un site de projet.
      - name: Construire la version web
        run: >
          flutter build web --release
          --no-web-resources-cdn
          --pwa-strategy offline-first
          --base-href /Evobusiness/

      - name: Publier sur gh-pages
        run: |
          cd build/web
          # Sans ce fichier, GitHub passerait le site par Jekyll et écarterait
          # certains fichiers du moteur Flutter.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Version web ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
