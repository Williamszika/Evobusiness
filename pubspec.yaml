name: evobusiness
description: Gestion de boutique de mèches et perruques — stock, ventes, reçus, clientes, dépenses et rapports.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État de l'application
  flutter_riverpod: ^2.6.1

  # Base de données locale (aucune génération de code)
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6

  # Reçus : PDF, aperçu, impression
  pdf: ^3.13.0
  printing: ^5.15.0

  # Partage (PDF, sauvegarde) et liens WhatsApp / téléphone
  url_launcher: ^6.3.2
  file_picker: ^10.0.0

  # Affichage
  intl: ^0.20.3
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
